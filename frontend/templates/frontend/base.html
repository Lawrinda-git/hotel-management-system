<!DOCTYPE html>
{% load static %}
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}StayHub | Luxury Stays{% endblock %}</title>

<!-- Preconnect to font origins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=Noto+Serif:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

<!-- Design System CSS -->
<link rel="stylesheet" href="{% static 'frontend/css/base.css' %}">
<link rel="stylesheet" href="{% static 'frontend/css/components.css' %}">

{% block extra_head %}{% endblock %}

{% block tailwind_config %}
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "inverse-on-surface": "#eff1f3",
                    "surface-container-high": "#e6e8ea",
                    "surface-container": "#eceef0",
                    "on-surface-variant": "#444653",
                    "on-primary-container": "#a8b8ff",
                    "tertiary": "#611e00",
                    "on-primary-fixed": "#001453",
                    "surface-container-highest": "#e0e3e5",
                    "primary-fixed-dim": "#b8c4ff",
                    "on-tertiary": "#ffffff",
                    "surface-variant": "#e0e3e5",
                    "surface-dim": "#d8dadc",
                    "error": "#ba1a1a",
                    "outline-variant": "#c4c5d5",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed": "#380d00",
                    "on-background": "#191c1e",
                    "on-secondary": "#ffffff",
                    "inverse-primary": "#b8c4ff",
                    "tertiary-fixed-dim": "#ffb59a",
                    "on-secondary-fixed-variant": "#574500",
                    "tertiary-container": "#872d00",
                    "secondary-fixed-dim": "#e9c349",
                    "on-surface": "#191c1e",
                    "on-primary-fixed-variant": "#173bab",
                    "on-error": "#ffffff",
                    "secondary-fixed": "#ffe088",
                    "secondary": "#735c00",
                    "surface-container-low": "#f2f4f6",
                    "tertiary-fixed": "#ffdbce",
                    "primary-container": "#1e40af",
                    "surface": "#f7f9fb",
                    "inverse-surface": "#2d3133",
                    "primary": "#00288e",
                    "on-secondary-container": "#745c00",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed": "#241a00",
                    "surface-tint": "#3755c3",
                    "surface-bright": "#f7f9fb",
                    "outline": "#757684",
                    "on-tertiary-container": "#ffa583",
                    "error-container": "#ffdad6",
                    "background": "#f7f9fb",
                    "primary-fixed": "#dde1ff",
                    "secondary-container": "#fed65b",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#802a00"
                },
                "borderRadius": {
                    "DEFAULT": "8px",
                    "lg": "12px",
                    "xl": "16px",
                    "full": "9999px"
                },
                "spacing": {
                    "margin-desktop": "40px",
                    "container-max": "1440px",
                    "unit": "8px",
                    "margin-mobile": "20px",
                    "gutter": "24px"
                },
                "fontFamily": {
                    "body-lg": ["Hanken Grotesk"],
                    "label-sm": ["Hanken Grotesk"],
                    "label-md": ["Hanken Grotesk"],
                    "headline-lg": ["Noto Serif"],
                    "body-md": ["Hanken Grotesk"],
                    "headline-xl": ["Noto Serif"],
                    "headline-md": ["Noto Serif"],
                    "headline-lg-mobile": ["Noto Serif"]
                },
                "fontSize": {
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "1.2", "fontWeight": "500"}],
                    "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-xl": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "1.4", "fontWeight": "500"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}]
                }
            }
        }
    }
</script>
{% endblock %}
</head>
<body class="bg-surface font-body-md text-on-surface antialiased {% block body_class %}{% endblock %}">

{% block content %}{% endblock %}

<!-- Toast container (used by main.js) -->
<div id="app-toast" class="fixed bottom-6 left-1/2 z-[100] hidden max-w-sm -translate-x-1/2 rounded-xl bg-on-surface px-5 py-3 text-center text-sm font-medium text-surface shadow-2xl" role="status" aria-live="polite"></div>

<!-- Design System JS -->
<script src="{% static 'frontend/js/main.js' %}"></script>

{% block extra_scripts %}{% endblock %}
</body>
</html>
