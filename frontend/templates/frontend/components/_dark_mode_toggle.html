{% comment %}StayHub dark-mode toggle component.{% endcomment %}
<label class="toggle dark-mode-toggle-wrapper">
    <span class="toggle-label">Dark Mode</span>
    <span class="toggle">
        <input type="checkbox" class="toggle-input dark-mode-toggle"
               {% if request.COOKIES.dark_mode or request.session.dark_mode %}checked{% endif %}>
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
    </span>
</label>

<script>
(function () {
    var toggle = document.querySelector('.dark-mode-toggle');
    if (toggle) toggle.checked = document.documentElement.classList.contains('dark');
})();
</script>
