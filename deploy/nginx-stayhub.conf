# StayHub nginx site config
# Copy to /etc/nginx/sites-available/stayhub and symlink into sites-enabled.
# Replace your-domain.com with your real domain (or the public IP).

server {
    listen 80;
    server_name your-domain.com;

    client_max_body_size 10M;

    # Static files (collected by `manage.py collectstatic`)
    location /static/ {
        alias /home/ubuntu/stayhub/staticfiles/;
    }

    # User-uploaded media (hotel images, profile pictures)
    location /media/ {
        alias /home/ubuntu/stayhub/media/;
    }

    # Everything else -> gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
